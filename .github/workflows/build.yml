name: build

# Build the Zircon engine for Linux and Windows.
#
# Each job keeps its build-obj/ in the Actions cache so successive runs compile
# incrementally (warm). If the warm build fails (e.g. a stale object after a flag
# change), the job bumps a rolling failure counter and retries ONCE from clean with
# no cache. The warm cache is only (re)saved after a build that actually succeeded,
# so a bad cache never persists.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Keep downloaded .deb and make the archive writable
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo mkdir -p /var/cache/apt/archives
          sudo chown "$(id -un)" /var/cache/apt/archives

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: linux-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: linux-apt-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev zlib1g-dev
          # jpeg/curl/vorbis/d0_blind_id are dlopen'd at runtime, no -dev needed to build.

      - name: Restore warm build cache
        uses: actions/cache/restore@v6
        with:
          path: build-obj
          key: linux-buildobj-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            linux-buildobj-${{ github.ref_name }}-
            linux-buildobj-

      - name: Restore failure counter
        uses: actions/cache/restore@v6
        with:
          path: .ci_failcount
          key: linux-failcount-${{ github.run_id }}
          restore-keys: linux-failcount-

      - name: Build (warm)
        id: warm
        continue-on-error: true
        run: make -f makefile -j"$(nproc)" DP_LINK_JPEG=dlopen sdl-release sv-release

      - name: Clean retry (no cache)
        id: retry
        if: steps.warm.outcome == 'failure'
        run: |
          n=$(cat .ci_failcount 2>/dev/null || echo 0); echo $((n + 1)) > .ci_failcount
          echo "::warning::Warm build failed; rolling failure count now $(cat .ci_failcount). Retrying clean."
          echo "Warm build FAILED — clean retry. Rolling failures: $(cat .ci_failcount)" >> "$GITHUB_STEP_SUMMARY"
          make -f makefile clean || true
          rm -rf build-obj
          make -f makefile -j"$(nproc)" DP_LINK_JPEG=dlopen sdl-release sv-release

      - name: Sanity check binaries
        run: |
          file zircon_beta_linux_sdl zircon_beta_linux_dedicated_server
          ldd zircon_beta_linux_sdl | (! grep -i 'not found')

      - name: Save warm build cache (only after a good build)
        if: success()
        uses: actions/cache/save@v6
        with:
          path: build-obj
          key: linux-buildobj-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save failure counter
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ci_failcount
          key: linux-failcount-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        with:
          name: zircon-linux-x86_64
          path: |
            zircon_beta_linux_sdl
            zircon_beta_linux_dedicated_server
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      # setup-msys2 caches the downloaded pacman packages for the `install:` list
      # natively (keyed to this config), so these deps are not re-downloaded each run.
      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # MINGW64 (msvcrt) kept intentionally: it matches the CRT of the libjpeg/SDL2/
          # zlib/curl DLLs shipped in the package. UCRT64 would change the runtime ABI.
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libjpeg-turbo

      - name: Restore warm build cache
        uses: actions/cache/restore@v6
        with:
          path: build-obj
          key: windows-buildobj-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            windows-buildobj-${{ github.ref_name }}-
            windows-buildobj-

      - name: Restore failure counter
        uses: actions/cache/restore@v6
        with:
          path: .ci_failcount
          key: windows-failcount-${{ github.run_id }}
          restore-keys: windows-failcount-

      - name: Build (warm)
        id: warm
        continue-on-error: true
        run: |
          # WINDIR is set under MSYS2, so the engine makefile auto-selects the mingw
          # target and produces the .exe name. Client only: the package ships the
          # Windows client, not a Windows dedicated server, and the makefile's mingw
          # OBJ_SV (unix sys/thread objects) does not link on mingw.
          make -f makefile -j"$(nproc)" sdl-release

      - name: Clean retry (no cache)
        id: retry
        if: steps.warm.outcome == 'failure'
        run: |
          n=$(cat .ci_failcount 2>/dev/null || echo 0); echo $((n + 1)) > .ci_failcount
          echo "::warning::Warm build failed; rolling failure count now $(cat .ci_failcount). Retrying clean."
          echo "Warm build FAILED — clean retry. Rolling failures: $(cat .ci_failcount)" >> "$GITHUB_STEP_SUMMARY"
          make -f makefile clean || true
          rm -rf build-obj
          make -f makefile -j"$(nproc)" sdl-release

      - name: List outputs
        run: ls -la zircon_beta_windows_*.exe

      - name: Save warm build cache (only after a good build)
        if: success()
        uses: actions/cache/save@v6
        with:
          path: build-obj
          key: windows-buildobj-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save failure counter
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ci_failcount
          key: windows-failcount-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        with:
          name: zircon-windows-x86_64
          path: zircon_beta_windows_sdl.exe
          if-no-files-found: error
          # Note: the .exe needs matching runtime DLLs alongside it to actually run
          # (SDL2.dll, libjpeg, zlib1, libcurl, ...).
